services:
  registry:
    build: .
    image: curator-skill-registry:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:8082"
    volumes:
      - registry-data:/data
      # Startup checkpoint gate (profile §6): mount the operator's signed
      # checkpoint (a registry-snapshot-v1 file kept outside the primary
      # store) read-only and point the service at it. Without it the service
      # records checkpoint_not_configured; with it, a live state below or
      # inconsistent with the checkpoint stays up non-ready (/health 503)
      # with writes disabled instead of serving stale state.
      # - /secure-high-water/registry-snapshot.json:/checkpoint/registry-snapshot.json:ro
    environment:
      CURATOR_SKILL_REGISTRY_HOME: /data
      # CURATOR_SKILL_REGISTRY_CHECKPOINT: /checkpoint/registry-snapshot.json
    # The 30 s probe is a cheap cached-verdict read (no chain walk); the
    # server-side full re-verification interval is configured with
    # --health-verify-interval (default 300 s).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8082/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  registry-data:
